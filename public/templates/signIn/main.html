{{define "main"}}
<main>
    <form id="signInForm">
    <fieldset>
        <legend>Email</legend>
        <input type="email" 
               name="email" 
               id="email"
               required />
    </fieldset>
    <fieldset>
        <legend>Password</legend>
        <input type="password" 
               name="password"
               id="password"
               required />
    </fieldset>
    <button type="button" id="signInButton">Sign in</button>
</form>
</main>
{{end}}
